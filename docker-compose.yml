version: "3.8"

services:
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phptest-web
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: phptest-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: phptest
      MYSQL_USER: phptestuser
      MYSQL_PASSWORD: phptestpass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phptest-phpmyadmin
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "8081:80"
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog
    container_name: phptest-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  db_data:
